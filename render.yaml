# Free deployment. The instance sleeps when idle and its files are temporary.
services:
  - type: web
    name: ai-re-lab-chanmin6785
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    envVars:
      - key: BAZE_LAB_OWNER_PASSWORD
        sync: false
      - key: BAZE_LAB_FRIEND_PASSWORD
        sync: false
      - key: BAZE_LAB_MEMBER3_PASSWORD
        sync: false
      - key: BAZE_LAB_MEMBER4_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BAZE_LAB_KEY_ENCRYPTION_KEY
        sync: false



